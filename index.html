<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSpace</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f5; padding: 15px; margin: 0; color: #333; }
        h2 { text-align: center; }
        .product { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product img { max-width: 100%; height: 120px; object-fit: contain; }
        .price { font-weight: bold; color: #2e7d32; font-size: 1.1em; margin: 10px 0; }
        button { background: #0088cc; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; width: 100%; }
        #order-btn { position: fixed; bottom: 10px; left: 5%; width: 90%; background: #4caf50; font-size: 16px; padding: 15px; display: none; }
    </style>
</head>
<body>

    <h2>📱 Магазин TechSpace</h2>

    <!-- Товар 1 -->
    <div class="product">
        <img src="https://via.placeholder.com/150/0088cc/ffffff?text=Smartphone" alt="Смартфон">
        <h3>Смартфон TechPhone 15</h3>
        <p>Мощный флагман с отличной камерой.</p>
        <div class="price">79 900 ₽</div>
        <button onclick="addToCart('Смартфон TechPhone 15', 79900)">В корзину</button>
    </div>

    <!-- Товар 2 -->
    <div class="product">
        <img src="https://via.placeholder.com/150/0088cc/ffffff?text=Headphones" alt="Наушники">
        <h3>Беспроводные Наушники</h3>
        <p>Чистый звук и шумоподавление.</p>
        <div class="price">12 500 ₽</div>
        <button onclick="addToCart('Беспроводные Наушники', 12500)">В корзину</button>
    </div>

    <!-- Товар 3 -->
    <div class="product">
        <img src="https://via.placeholder.com/150/0088cc/ffffff?text=Laptop" alt="Ноутбук">
        <h3>Ноутбук TechBook Pro</h3>
        <p>Быстрый ноутбук для работы и игр.</p>
        <div class="price">115 000 ₽</div>
        <button onclick="addToCart('Ноутбук TechBook Pro', 115000)">В корзину</button>
    </div>

    <!-- Главная кнопка оформления -->
    <button id="order-btn" onclick="sendOrder()">Оформить заказ (0 ₽)</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем окно

        let cart = [];
        let total = 0;

        function addToCart(title, price) {
            cart.push({title, price});
            total += price;
            
            let btn = document.getElementById('order-btn');
            btn.style.display = 'block';
            btn.innerText = Оформить заказ (${total.toLocaleString()} ₽);
        }

        function sendOrder() {
            let orderText = cart.map(item => ${item.title} — ${item.price} ₽).join('\n');
            orderText += \n\n💰 Итого: ${total.toLocaleString()} ₽;
            
            // Отправляем данные обратно боту
            tg.sendData(orderText);
        }
    </script>
</body>
</html>
